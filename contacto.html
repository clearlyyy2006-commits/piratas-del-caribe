<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <meta
      name="description"
      content="Formulario de contacto para enviar mensajes"
    />
    <link rel="icon" href="favicon_io/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Formulario de contacto</h1>
    </header>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="peliculas.html">Películas</a>
      <a href="personajes.html">Personajes</a>
      <a href="contacto.html">Formulario</a>
    </nav>
    <main>
      <article>
        <form>
          <fieldset>
            <legend>Tus datos personales</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required />
            <label for="email">Correo:</label>
            <input type="email" id="email" name="email" required />
          </fieldset>
          <fieldset>
            <legend>Motivo del contacto</legend>

            <input
              type="radio"
              id="consulta"
              name="motivo"
              value="consulta"
              checked
              required
            />
            <label for="consulta">Consulta general</label>

            <input
              type="radio"
              id="informacion"
              name="motivo"
              value="información"
            />
            <label for="informacion">Solicitar información</label>

            <input type="radio" id="opinion" name="motivo" value="opinión" />
            <label for="opinion">Compartir mi opinión</label>
          </fieldset>
          <fieldset>
            <legend>Servicios de interés</legend>

            <input
              type="checkbox"
              id="peliculas"
              name="intereses"
              value="películas"
            />
            <label for="peliculas">Películas</label>

            <input
              type="checkbox"
              id="personajes"
              name="intereses"
              value="personajes"
            />
            <label for="personajes">Personajes</label>

            <input
              type="checkbox"
              id="curiosidades"
              name="intereses"
              value="curiosidades"
            />
            <label for="curiosidades">Curiosidades</label>
          </fieldset>
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
          <button type="submit">Enviar</button>
        </form>
      </article>
    </main>
    <footer>
      <p>© 2026 Web sobre Piratas del Caribe</p>
      <p>Proyecto realizado por Clara</p>
    </footer>
  </body>
</html>
